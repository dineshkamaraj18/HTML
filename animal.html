<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Store</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    header {
      background-color: #c21f1f;
      color: rgb(247, 243, 243);
      padding: 15px;
      text-align: center;
    }

    nav {
      background-color: #0f0c0c;
      text-align: center;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    .hero {
      padding: 40px;
      text-align: center;
      background-color: #c6ebd8;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    article {
      background-color: white;
      width: 200px;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(23, 24, 23, 0.1);
    }

    article img {
      width: 100%;
      border-radius: 8px;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Happy Paws Pet Store</h1>
    <p>Everything for your lovely pets</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <section class="hero">
      <h2>Welcome to Happy Paws</h2>
      <p><strong>Christmas offers</strong></p>
    </section>


    <section class="products">

      <article>
        <img src="dog.webp" alt="Dog Sweater">
        <h3>Dog Sweater</h3>
      </article>

      <article>
        <img src="sweater.webp" alt="Cat Sweater">
        <h3>Cat</h3>
      </article>

      <article>
        <img src="pet.webp" alt="Pet Dress">
        <h3>Christmas Dress</h3>
      </article>
    </section>

  </main>
  <footer>
    <p>© Happy Paws Pet Store</p>
  </footer>
</body>
</html>
