<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width.device-width,inital-scale-1.0">
    <title>
        WEBSITE</title>
</head>
<body style="background-color: rgb(26, 22, 22);text-align: center;">
    <h1 style="text-align: center;color: beige;">EVENT REGISTRATION FORM</h1>
    <form style="border:10px;padding:10px;margin: 0 auto;border-radius: 10px;background-color: rgb(170, 160, 146);">
        <label>NAME :</label>
        <input type="text" placeholder="Enter your name"><br><br>
        <label>EMAIL :</label>
        <input type="email" placeholder="Enter your email"><br><br>
        <label>SELECT DEPARTMENT :</label>
        <select>
            <option>IT</option>
            <option>CS</option>
            <option>CT</option>
            <option>CA</option>
            <option>AIML</option>
            <option>AIDS</option>
        </select><br><br>
        <label>GENDER :</label>
        <select>
            <option>MALE</option>
            <option>FEMALE</option>
        </select><br><br>
        <label>DATE OF BIRTH :</label>
        <input type="date"> <br><br>
        <label>EVENT </label> <br>
        <input type="checkbox">QUIZ <br>
        <input type="checkbox">DEBBUGING <br>
        <input type="checkbox">IMAGE CRAFT <br>
        <input type="checkbox">DANCE DUO <br>
        <input type="checkbox">FASHION SHOW <br><br>
        <label>MOBILE NUMBER :</label>
        <input type="number" placeholder="Enter your number"><br><br>
        <label>STUDENT ID PDF :</label>
        <input type="file"><br><br>
        <button type="submit">SUBMIT</button>
        <button type="cancel">CANCEL</button>
    </form>
</body>
</html>
